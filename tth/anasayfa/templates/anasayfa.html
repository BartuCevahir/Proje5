<!DOCTYPE html>
<html lang="tr">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Takdir ve Teşekkür Hesaplayıcı</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1d2671, #c33764);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 30px;
        }

        .kart {
            width: 900px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 30px;
            color: white;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .aciklama {
            text-align: center;
            margin-bottom: 30px;
        }

        .dersler {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .ders {
            background: rgba(255, 255, 255, 0.08);
            padding: 15px;
            border-radius: 12px;
        }

        .ders label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .ders input {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            margin-top: 25px;
            font-size: 18px;
            cursor: pointer;
        }

        .sonuc {
            text-align: center;
            margin-top: 25px;
        }

    </style>

</head>

    <script>

    document.addEventListener("DOMContentLoaded", function () {

        const notlar = document.querySelectorAll('input[name$="_not"]');
        const saatler = document.querySelectorAll('input[name$="_saat"]');

        notlar.forEach(function (input) {

            input.addEventListener("input", function () {

                if (parseFloat(this.value) > 100) {
                    this.value = 100;
                }

            });

        });

        saatler.forEach(function (input) {

            input.addEventListener("input", function () {

                if (parseInt(this.value) > 99) {
                    this.value = 99;
                }

            });

        });

    });

function temizle() {

        const inputlar = document.querySelectorAll("input");

        inputlar.forEach(function(input) {

            if (input.type !== "hidden") {
                input.value = "";
            }

        });

        const sonucKutusu = document.getElementById("sonuc-kutusu");

        if (sonucKutusu) {
            sonucKutusu.style.display = "none";
        }

    }
